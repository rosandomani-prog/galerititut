<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeri Titut</title>
<meta name="description" content="Tempat kita menempel kenangan bersama.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Caveat:wght@500;700&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="sun" aria-hidden="true"></div>
  <p class="note">kenangan kita, ditempel satu-satu</p>
  <h1>Galeri Titut</h1>
  <p class="lead">Tempat menyimpan foto bersama. Unggah foto, dan ia langsung menempel di papan ini.</p>
  <button class="btn" id="btnTambah" type="button">Tempel foto baru</button>
</header>

<main>
  <section class="board" id="board" aria-label="Kolase foto"></section>
</main>

<footer>Galeri Titut &mdash; dibuat untuk kita</footer>

<dialog id="dlgUnggah">
  <form id="form" method="dialog">
    <h2>Tempel foto baru</h2>
    <label>Pilih foto
      <input type="file" id="file" accept="image/*" multiple required>
    </label>
    <label>Keterangan (opsional)
      <input type="text" id="caption" maxlength="60" placeholder="mis. Sore di pantai">
    </label>
    <label>Nama kamu (opsional)
      <input type="text" id="by" maxlength="24" placeholder="mis. Rani">
    </label>
    <p class="status" id="status" role="status"></p>
    <div class="row">
      <button type="button" class="btn ghost" id="batal">Batal</button>
      <button type="submit" class="btn" id="simpan">Simpan</button>
    </div>
  </form>
</dialog>

<dialog id="dlgLihat">
  <img id="besar" alt="">
  <p id="ket"></p>
  <div class="row">
    <button type="button" class="btn ghost" id="hapus" hidden>Hapus foto</button>
    <button type="button" class="btn" id="tutup">Tutup</button>
  </div>
</dialog>
<script src="script.js"></script>
</body>
</html>
